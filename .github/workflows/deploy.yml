# ============================================================
# Auto Deploy —— push 后自动 SSH 到服务器：git pull + npm install + npm run build
# 位置：仓库根目录 .github/workflows/deploy.yml
# 说明：脚本内加了 [n/6] 进度标记，失败时看 Actions 日志最后一行标记即可定位
# ============================================================

name: Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Pull code & build on server
    runs-on: ubuntu-latest
    steps:
      - name: SSH to server, git pull & rebuild
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            cd /root/zero-to-tech

            echo "===== [1/6] sync code ====="
            git fetch origin main
            git reset --hard origin/main
            git log --oneline -1

            echo "===== [2/6] node env ====="
            echo "PATH=$PATH"
            node -v
            npm -v

            echo "===== [3/6] node version check (vite 8 needs ^20.19.0 || >=22.12.0) ====="
            node -e "const v=process.versions.node.split('.').map(Number);const ok=(v[0]===20&&v[1]>=19)||(v[0]>=22&&(v[0]>22||v[1]>=12));if(!ok){console.error('NODE VERSION TOO OLD: '+process.versions.node+' ; need 20.19+ or 22.12+');process.exit(1)}console.log('node version OK: '+process.versions.node)"

            echo "===== [4/6] npm install ====="
            # 服务器访问官方源慢时，取消下一行注释换国内镜像
            # npm config set registry https://registry.npmmirror.com
            npm install --no-audit --no-fund

            echo "===== [5/6] npm run build ====="
            export NODE_OPTIONS=--max-old-space-size=2048
            npm run build

            echo "===== [6/6] dist output ====="
            ls -lh dist

            # 前端静态产物无需重启服务（nginx 直接读 dist）；有后端进程再按需重启：
            # pm2 restart app
            # sudo systemctl restart myapp
